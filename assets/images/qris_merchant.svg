<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="qrisHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.12" flood-color="#0f172a"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="20" y="20" width="560" height="760" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" filter="url(#cardShadow)"/>

  <!-- Top QRIS Red Banner Header -->
  <path d="M 20 48 Q 20 20 48 20 L 552 20 Q 580 20 580 48 L 580 110 L 20 110 Z" fill="#ffffff"/>
  
  <!-- QRIS Official Stylized Logo -->
  <g transform="translate(230, 45)">
    <!-- Q letter -->
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#e11d48"/>
    <rect x="8" y="8" width="24" height="24" rx="4" fill="#ffffff"/>
    <rect x="15" y="15" width="10" height="10" rx="2" fill="#e11d48"/>
    <!-- Text QRIS -->
    <text x="50" y="32" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="900" fill="#0f172a" letter-spacing="2">QRIS</text>
  </g>
  <text x="300" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">STANDAR PEMBAYARAN DIGITAL NASIONAL</text>

  <!-- Separator Line -->
  <line x1="50" y1="120" x2="550" y2="120" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Merchant Info -->
  <text x="300" y="155" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="middle">LOCK &amp; ROOM (L n' R)</text>
  <text x="300" y="180" font-family="'Plus Jakarta Sans', monospace" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">NMID: ID1020030040050 • A01</text>

  <!-- QR Code Frame Box -->
  <rect x="110" y="210" width="380" height="380" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Stylized QR Code Pixels -->
  <g transform="translate(140, 240)">
    <!-- Top-Left Target Box -->
    <rect x="0" y="0" width="80" height="80" rx="14" fill="#0f172a"/>
    <rect x="12" y="12" width="56" height="56" rx="8" fill="#ffffff"/>
    <rect x="24" y="24" width="32" height="32" rx="4" fill="#0f172a"/>

    <!-- Top-Right Target Box -->
    <rect x="240" y="0" width="80" height="80" rx="14" fill="#0f172a"/>
    <rect x="252" y="12" width="56" height="56" rx="8" fill="#ffffff"/>
    <rect x="264" y="24" width="32" height="32" rx="4" fill="#0f172a"/>

    <!-- Bottom-Left Target Box -->
    <rect x="0" y="240" width="80" height="80" rx="14" fill="#0f172a"/>
    <rect x="12" y="252" width="56" height="56" rx="8" fill="#ffffff"/>
    <rect x="24" y="264" width="32" height="32" rx="4" fill="#0f172a"/>

    <!-- Random QR Pattern Matrix Blocks -->
    <rect x="100" y="10" width="20" height="40" fill="#0f172a"/>
    <rect x="140" y="0" width="30" height="20" fill="#0f172a"/>
    <rect x="190" y="15" width="20" height="25" fill="#0f172a"/>
    <rect x="100" y="70" width="45" height="20" fill="#0f172a"/>
    <rect x="170" y="60" width="25" height="30" fill="#0f172a"/>
    <rect x="210" y="75" width="15" height="15" fill="#0f172a"/>

    <rect x="15" y="100" width="25" height="40" fill="#0f172a"/>
    <rect x="60" y="110" width="30" height="20" fill="#0f172a"/>
    <rect x="10" y="160" width="40" height="25" fill="#0f172a"/>
    <rect x="65" y="150" width="20" height="40" fill="#0f172a"/>
    <rect x="20" y="200" width="50" height="20" fill="#0f172a"/>

    <rect x="250" y="100" width="30" height="20" fill="#0f172a"/>
    <rect x="295" y="115" width="20" height="35" fill="#0f172a"/>
    <rect x="240" y="145" width="40" height="20" fill="#0f172a"/>
    <rect x="290" y="170" width="30" height="25" fill="#0f172a"/>
    <rect x="245" y="195" width="25" height="25" fill="#0f172a"/>

    <rect x="105" y="245" width="25" height="35" fill="#0f172a"/>
    <rect x="145" y="240" width="40" height="20" fill="#0f172a"/>
    <rect x="200" y="250" width="20" height="30" fill="#0f172a"/>
    <rect x="240" y="240" width="30" height="20" fill="#0f172a"/>
    <rect x="285" y="255" width="35" height="20" fill="#0f172a"/>

    <rect x="100" y="295" width="40" height="25" fill="#0f172a"/>
    <rect x="160" y="280" width="30" height="35" fill="#0f172a"/>
    <rect x="215" y="290" width="25" height="30" fill="#0f172a"/>
    <rect x="260" y="295" width="45" height="25" fill="#0f172a"/>

    <!-- Center Logo Emblem: GOPAY & QRIS -->
    <rect x="120" y="120" width="80" height="80" rx="20" fill="#ffffff" stroke="#00aed6" stroke-width="4"/>
    <circle cx="160" cy="160" r="26" fill="#00aed6"/>
    <circle cx="160" cy="160" r="14" fill="#ffffff"/>
    <circle cx="160" cy="160" r="7" fill="#00aed6"/>
  </g>

  <!-- Replaceable Badge Watermark -->
  <rect x="130" y="555" width="340" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="300" y="572" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#b45309" text-anchor="middle">⚙️ QRIS TEMPLATE — DAPAT DIGANTI DI MENU ADMIN</text>

  <!-- Bottom Accepted Payment Badges -->
  <text x="300" y="635" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">MENERIMA SEMUA PEMBAYARAN DIGITAL:</text>

  <g transform="translate(60, 655)">
    <!-- GoPay Badge -->
    <rect x="0" y="0" width="85" height="36" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="42.5" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#00aed6" text-anchor="middle">gopay</text>

    <!-- OVO Badge -->
    <rect x="95" y="0" width="65" height="36" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="127.5" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#7c3aed" text-anchor="middle">OVO</text>

    <!-- DANA Badge -->
    <rect x="170" y="0" width="70" height="36" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="205" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#2563eb" text-anchor="middle">DANA</text>

    <!-- ShopeePay Badge -->
    <rect x="250" y="0" width="85" height="36" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="292.5" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#ea580c" text-anchor="middle">ShopeePay</text>

    <!-- Mobile Banking Badge -->
    <rect x="345" y="0" width="135" height="36" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="412.5" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#334155" text-anchor="middle">BCA / Mandiri / BRI</text>
  </g>

  <!-- Secure Footer -->
  <text x="300" y="730" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">🔒 Transaksi Aman Terlindungi Standar QRIS Nasional &amp; Bank Indonesia</text>
</svg>
